version: '3.8'

services:
  # ─── Vector Database ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: terralegal_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__LOG_LEVEL=INFO

  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: terralegal_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: terralegal
      POSTGRES_USER: terralegal_user
      POSTGRES_PASSWORD: terralegal_pass_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terralegal_user -d terralegal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: terralegal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ─── Qdrant Dashboard (Web UI) ────────────────────────────────────
  qdrant_dashboard:
    image: qdrant/qdrant:latest
    container_name: terralegal_qdrant_ui
    depends_on:
      - qdrant
    # Access Qdrant built-in dashboard at http://localhost:6333/dashboard

  # ─── Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: terralegal_backend
    env_file: .env
    command: ["python", "-m", "uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - QDRANT_HOST=qdrant
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      # Cập nhật DATABASE_URL để trỏ vào container postgres thay vì localhost
      - DATABASE_URL=postgresql+asyncpg://terralegal_user:terralegal_pass_dev@postgres:5432/terralegal
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend   # hot-reload: code changes apply without rebuild
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: terralegal_frontend
    environment:
      # LƯU Ý: Nếu gửi qua máy khác và truy cập từ xa, hãy đổi 'localhost' thành IP của máy đó (vd: http://192.168.1.100:8000)
      - NEXT_PUBLIC_API_URL=http://180.93.102.134:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:

networks:
  default:
    name: terralegal_network

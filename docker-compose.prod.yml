version: '3.8'

# ─── Production Docker Compose ────────────────────────────────────
# Sử dụng:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Yêu cầu: file .env với các biến môi trường production

services:
  # ─── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: terralegal_backend
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # One worker keeps RAM stable; these let its embedding workload use the
      # two CPU cores now available on the VPS.
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
    # Production: không dùng --reload, chạy một worker phù hợp VPS 1 vCPU.
    command: [
      "gunicorn", "backend.app.main:app",
      "-k", "uvicorn.workers.UvicornWorker",
      # VPS hiện có 1 vCPU; một worker tránh nạp trùng model embedding và
      # cho độ trễ ổn định hơn dưới tải thấp/trung bình.
      "-w", "1",
      "--bind", "0.0.0.0:8000",
      "--timeout", "120",
      "--keep-alive", "5",
      "--access-logfile", "-"
    ]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1800M   # multilingual-e5-small ~200MB, còn lại cho app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ─── Frontend Next.js ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is embedded into browser JavaScript at build time.
        NEXT_PUBLIC_API_URL: https://api.trolyphaplydatdai.online
    container_name: terralegal_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.trolyphaplydatdai.online
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ─── Vector Database ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: terralegal_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - QDRANT__LOG_LEVEL=WARN

  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: terralegal_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terralegal}
      POSTGRES_USER: ${POSTGRES_USER:-terralegal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terralegal_user} -d ${POSTGRES_DB:-terralegal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: terralegal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Giới hạn Redis chỉ dùng tối đa 128MB RAM
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-} --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 160M

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: terralegal_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  nginx_certs:

networks:
  default:
    name: terralegal_prod_network

version: '3.8'

# ─── Production Docker Compose ────────────────────────────────────
# Sử dụng:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Yêu cầu: file .env với các biến môi trường production

services:
  # ─── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: terralegal_backend
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # Browser frontend runs on the public site while the API uses its own
      # subdomain. Override any development-only value from .env.
      - CORS_ORIGINS=["https://trolyphaplydatdai.online","https://www.trolyphaplydatdai.online","http://localhost:3000"]
      # One worker keeps RAM stable; these let its embedding workload use the
      # two CPU cores now available on the VPS.
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
      # Keep Hugging Face/SentenceTransformer model files on the existing
      # persistent data mount.  Rebuilding the image must never force the
      # first chat request to download BGE-M3 again.
      - HF_HOME=/app/data/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/data/huggingface/sentence_transformers
      - HF_HUB_DISABLE_TELEMETRY=1
      # Keep legal answers complete but avoid an unnecessarily long 4,096-token
      # generation on a small VPS / remote LLM connection.
      - GEMINI_MAX_TOKENS=1200
      - RERANKER_TOP_K=3
    # Production: không dùng --reload, chạy một worker phù hợp VPS 1 vCPU.
    command: [
      "gunicorn", "backend.app.main:app",
      "-k", "uvicorn.workers.UvicornWorker",
      # VPS hiện có 1 vCPU; một worker tránh nạp trùng model embedding và
      # cho độ trễ ổn định hơn dưới tải thấp/trung bình.
      "-w", "1",
      "--bind", "0.0.0.0:8000",
      "--timeout", "120",
      "--keep-alive", "5",
      "--access-logfile", "-"
    ]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 9 GB VPS: room for the API, E5 model and document processing while
          # still leaving memory for Qdrant, PostgreSQL and the OS.
          memory: 3500M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ─── Frontend Next.js ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is embedded into browser JavaScript at build time.
        NEXT_PUBLIC_API_URL: https://api.trolyphaplydatdai.online
    container_name: terralegal_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.trolyphaplydatdai.online
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ─── Vector Database ──────────────────────────────────────────────────────
  qdrant:
    # Match qdrant-client 1.18 and start on a fresh volume.  The legacy
    # qdrant_data volume contains pre-1.0 storage and is deliberately kept
    # untouched for forensic backup/recovery.
    image: qdrant/qdrant:v1.18.0
    container_name: terralegal_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_v2:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Larger vector cache materially improves repeat retrieval latency.
          memory: 1500M
    environment:
      - QDRANT__LOG_LEVEL=WARN

  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: terralegal_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terralegal}
      POSTGRES_USER: ${POSTGRES_USER:-terralegal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terralegal_user} -d ${POSTGRES_DB:-terralegal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: terralegal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # ``--requirepass`` must be omitted altogether when no password is set.
    # Passing an empty compose variable made Redis interpret --maxmemory as
    # its password and crash in a restart loop.
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
        exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: terralegal_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  # Legacy volume remains declared but is no longer mounted. Never remove it
  # until the new collection has been verified in production.
  qdrant_data:
  qdrant_data_v2:
  postgres_data:
  redis_data:
  nginx_certs:

networks:
  default:
    name: terralegal_prod_network
